name: schedule watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정에 따라 수 분 지연될 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          SCHEDULE_API: ${{ secrets.SCHEDULE_API }}
          SITE_LABEL: ${{ secrets.SITE_LABEL }}
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          if [ -f openings.log ]; then git add -- openings.log; fi
          if git diff --staged --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi

      - name: Notify failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 직전 실행도 실패였으면 이미 알렸으므로 생략 (연속 장애 시 5분마다 스팸 방지)
          prev=$(gh run list --workflow monitor.yml --limit 2 --json conclusion --jq '.[1].conclusion')
          if [ "$prev" = "failure" ]; then
            echo "already notified (previous run also failed)"
            exit 0
          fi
          curl -s -X POST https://ntfy.sh \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ 감시 실패\",\"message\":\"스케줄 감시가 실패했습니다. Actions 탭을 확인하세요.\",\"tags\":[\"warning\"],\"priority\":4,\"click\":\"https://github.com/$GITHUB_REPOSITORY/actions\"}"
