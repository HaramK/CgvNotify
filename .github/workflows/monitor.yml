name: schedule watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정에 따라 수 분 지연될 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          SCHEDULE_API: ${{ secrets.SCHEDULE_API }}
          SITE_LABEL: ${{ secrets.SITE_LABEL }}
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          if [ -f openings.log ]; then git add -- openings.log; fi
          if git diff --staged --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
